name: SEC probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe which User-Agent shapes SEC accepts
        env:
          SECRET_UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          url="https://data.sec.gov/submissions/CIK0001536411.json"
          probe() {
            code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" -A "$2" "$url" || true)
            echo "$code | $1"
            sleep 0.5
          }
          email=$(printf '%s' "$SECRET_UA" | grep -oE '[^ <>]+@[^ <>]+' | head -1 || true)
          words=$(printf '%s' "$SECRET_UA" | wc -w)
          echo "secret: words=$words has_email=$([ -n "$email" ] && echo yes || echo no) has_hyphen=$(printf '%s' "$SECRET_UA" | grep -c -- - || true) has_digit_in_name=$(printf '%s' "${SECRET_UA%%$email*}" | grep -c '[0-9]' || true)"
          probe "secret as-is" "$SECRET_UA"
          probe "digits in gmail local part" "Druckenmiller Tracker tracker9798@gmail.com"
          probe "letters-only gmail" "Druckenmiller Tracker trackerbot@gmail.com"
          probe "hyphen in local part" "Druckenmiller Tracker tracker-bot@gmail.com"
          probe "noreply without hyphen" "Druckenmiller Tracker bizarr@users.noreply.github.com"
          probe "example.com contact" "Druckenmiller Tracker admin@example.com"
          probe "secret domain, letters-only local" "Druckenmiller Tracker trackerbot@${email#*@}"
