name: SEC probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SEC endpoints with different User-Agents
        env:
          SECRET_UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          probe() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" -A "$2" -H "Accept-Encoding: gzip, deflate" "$3")
            title=$(grep -o "<title>[^<]*" /tmp/body | head -1)
            echo "$1 | $code | $3 | $title"
          }
          echo "secret UA length: ${#SECRET_UA}, non-ascii: $(printf '%s' "$SECRET_UA" | LC_ALL=C grep -c '[^ -~]')"
          for url in \
            "https://data.sec.gov/submissions/CIK0001536411.json" \
            "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=1536411&type=13F-HR&output=atom" \
            "https://www.sec.gov/Archives/edgar/data/1536411/"; do
            probe secret "$SECRET_UA" "$url"
            probe sec-doc-example "Sample Company Name AdminContact@sample.com" "$url"
            probe name-gmail "John Smith jsmith@gmail.com" "$url"
            sleep 1
          done
          echo "13f.info: $(curl -s -o /dev/null -w '%{http_code}' https://13f.info/manager/0001536411-duquesne-family-office-llc)"
