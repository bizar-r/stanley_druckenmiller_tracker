name: SEC probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe which User-Agent shapes SEC accepts
        env:
          SECRET_UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          url="https://data.sec.gov/submissions/CIK0001536411.json"
          probe() {
            code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" -A "$2" "$url" || true)
            echo "$code | $1"
            sleep 0.5
          }
          email=$(printf '%s' "$SECRET_UA" | grep -oE '[^ <>]+@[^ <>]+' | head -1 || true)
          words=$(printf '%s' "$SECRET_UA" | wc -w)
          echo "secret: words=$words has_email=$([ -n "$email" ] && echo yes || echo no) has_hyphen=$(printf '%s' "$SECRET_UA" | grep -c -- - || true) has_digit_in_name=$(printf '%s' "${SECRET_UA%%$email*}" | grep -c '[0-9]' || true)"
          probe "secret as-is" "$SECRET_UA"
          probe "Druckenmiller Tracker + secret email" "Druckenmiller Tracker $email"
          probe "Jane Doe + secret email" "Jane Doe $email"
          probe "secret email only" "$email"
          probe "hyphenated name + gmail" "druckenmiller-tracker jsmith@gmail.com"
          probe "plain name + noreply" "Druckenmiller Tracker bizar-r@users.noreply.github.com"
          probe "old default" "stanley-druckenmiller-tracker bizar-r@users.noreply.github.com"
          probe "plain name + gmail" "Druckenmiller Tracker jsmith@gmail.com"
